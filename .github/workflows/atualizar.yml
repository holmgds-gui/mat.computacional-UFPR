name: Atualizar painel, radar e calendário

on:
  schedule:
    - cron: "0 9 * * *"   # todos os dias às 06:00 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dados/**"
      - "scripts/**"
      - ".github/workflows/atualizar.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Radar de editais e notícias
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/radar.py

      - name: Painel do README e lembretes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/painel.py

      - name: Calendário (.ics)
        run: python scripts/gerar_calendario.py

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dados/estado
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualização automática $(TZ=America/Sao_Paulo date +%F)"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
