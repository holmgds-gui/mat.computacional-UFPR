name: Deploy no Google Cloud Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "dados/**"
      - "scripts/**"
      - "Dockerfile"
      - ".github/workflows/deploy-cloud-run.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Só executa se o secret GCP_PROJECT_ID estiver configurado no repositório
    if: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy no Cloud Run (southamerica-east1)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: siga-plus-ufpr
          region: southamerica-east1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          flags: "--allow-unauthenticated"
          env_vars: |
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_TOKEN=${{ secrets.PAT_GITHUB || secrets.GITHUB_TOKEN }}
            ALLOWED_EMAIL=${{ secrets.ALLOWED_EMAIL }}
