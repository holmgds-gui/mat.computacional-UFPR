name: Deploy no Google Firebase Hosting (Spark Gratuito)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "dados/**"
      - "scripts/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-cloud-run.yml"

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Verificar credencial do Firebase
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "Secret FIREBASE_SERVICE_ACCOUNT opcional ainda não configurado. O app já está publicado gratuitamente no GitHub Pages."

      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''

      - uses: actions/setup-python@v6
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt && python scripts/gerar_calendario.py
        if: env.FIREBASE_SERVICE_ACCOUNT != ''

      - name: Deploy para Firebase Hosting (Plano Spark Gratuito)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: mat-computacional-ufpr
