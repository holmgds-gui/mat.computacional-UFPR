# Optativas: mínimo 300h (5 disciplinas de 60h), recomendadas do 5º ao 8º semestre.
# Lista oficial: https://matind.ufpr.br/disciplinas-optativas/
# Trilhas sugeridas pelos seus interesses (otimização, ciência de dados, IA):
optativas_planejadas:
  - {codigo: CMI104,   nome: Aprendizagem de Máquina, trilha: IA, status: pendente}
  - {codigo: CMI103,   nome: Métodos Computacionais de Otimização, trilha: Otimização, status: pendente}
  - {codigo: CMI107,   nome: Tópicos em Otimização, trilha: Otimização, status: pendente}
  - {codigo: CE083,    nome: Estatística Computacional I, trilha: Dados, status: pendente}
  - {codigo: CE071,    nome: Análise de Regressão Linear, trilha: Dados, status: pendente}
  - {codigo: CI1164,   nome: Introdução à Computação Científica, trilha: Computação, status: cursando, depto: DINF, pasta: CI1164-introducao-computacao-cientifica}
  - {codigo: TT080,    nome: Economia de Engenharia, trilha: Gestão, status: cursando, depto: DTT, pasta: TT080-economia-engenharia}
  - {codigo: TT081,    nome: Administração de Empresas, trilha: Gestão, status: cursando, depto: DTT, pasta: TT081-administracao-empresas}
  - {codigo: MATE7036, nome: Otimização I (PPGM), trilha: Otimização, status: pendente, obs: "pós-graduação; pré-req Análise I"}
optativas_outras_listadas: [SA063, SA064, SA115, SA116, SC064, TP028, TP029, TP034, TP035, TP040, TP041, TP042, TP043,
